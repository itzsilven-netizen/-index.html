<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Standard — Collect leads. Build reputation. Stay consistent.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* logo-derived palette */
  --ink:#08090c;          /* near black */
  --char:#0d1117;         /* charcoal */
  --char-2:#11161f;
  --navy:#1a2536;         /* logo navy */
  --navy-2:#22324a;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --txt:#f3f5f7;
  --muted:#9aa3ad;
  --muted-2:#646e79;
  --silver:#c7ccd1;
  --accent:#aeb8c4;       /* cool silver accent */
  --accent-2:#5b6b80;     /* steel navy */
  --grad:linear-gradient(135deg,#cdd4dc 0%,#7e8b9c 50%,#3c4a5e 100%);
  --grad-soft:linear-gradient(135deg,rgba(174,184,196,.12),rgba(91,107,128,.10));
  --r:16px;
  --sb:248px;             /* sidebar width */
}
[data-theme="light"]{
  --ink:#eef1f4;--char:#f6f8fa;--char-2:#ffffff;--navy:#dfe5ec;--navy-2:#cdd6e0;
  --line:rgba(10,20,35,.10);--line-2:rgba(10,20,35,.16);
  --txt:#10151c;--muted:#4a5560;--muted-2:#74808c;--silver:#2a3340;
  --accent:#48566a;--accent-2:#6b7a8f;
  --grad:linear-gradient(135deg,#3c4a5e 0%,#5b6b80 50%,#8995a4 100%);
  --grad-soft:linear-gradient(135deg,rgba(60,74,94,.10),rgba(91,107,128,.08));
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--txt);
  font-family:'Inter',system-ui,sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .5s ease,color .5s ease;
}
a{color:inherit;text-decoration:none}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:600;font-size:15px;border-radius:999px;padding:13px 24px;cursor:pointer;
  border:1px solid transparent;white-space:nowrap;
  transition:transform .18s,box-shadow .25s,background .2s,border-color .2s,color .2s;}
.btn-primary{background:var(--grad);color:#0a0f16;box-shadow:0 10px 34px rgba(91,107,128,.32)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 46px rgba(174,184,196,.4)}
.btn-ghost{background:transparent;color:var(--txt);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--accent);background:rgba(174,184,196,.06)}
.btn-lg{padding:16px 32px;font-size:16px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---- sidebar ---- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb);z-index:90;
  background:linear-gradient(180deg,var(--char),var(--ink));
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:26px 18px;transition:transform .35s ease,background .5s;}
.sb-brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 24px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sb-mark{width:100%;max-width:170px;height:auto;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5)) brightness(1.15)}
[data-theme="light"] .sb-mark{filter:invert(.86) drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.sb-name{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.15}
.sb-name small{display:block;font-weight:500;font-size:10px;letter-spacing:.22em;color:var(--muted-2);margin-top:3px}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sb-link{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:11px;
  font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;
  transition:background .2s,color .2s;position:relative}
.sb-link svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;opacity:.85}
.sb-link:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.sb-link.active{background:var(--grad-soft);color:var(--txt);border:1px solid var(--line)}
.sb-link.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:3px;background:var(--grad)}
.sb-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:10px;display:flex;flex-direction:column;gap:3px}
.sb-toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:11px;
  font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:.2s}
.sb-toggle:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.tog-track{width:42px;height:23px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line-2);position:relative;transition:background .3s}
.tog-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--accent);transition:left .3s,background .3s}
[data-theme="light"] .tog-knob{left:21px;background:var(--navy)}

/* mobile sidebar */
.sb-burger{display:none;position:fixed;top:16px;left:16px;z-index:95;width:44px;height:44px;
  border-radius:12px;background:var(--char);border:1px solid var(--line);align-items:center;justify-content:center;cursor:pointer}
.sb-burger span{width:18px;height:2px;background:var(--txt);position:relative;display:block}
.sb-burger span::before,.sb-burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--txt)}
.sb-burger span::before{top:-6px}.sb-burger span::after{top:6px}
.sb-scrim{display:none;position:fixed;inset:0;z-index:88;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}

/* ---- main shell ---- */
.main{margin-left:var(--sb);transition:margin .35s}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px}
section{position:relative}

/* top bar (book demo, right) */
.topbar{position:fixed;top:0;left:var(--sb);right:0;height:0;z-index:80;pointer-events:none}
.topbar .tb-in{position:absolute;top:22px;right:40px;pointer-events:auto;display:flex;gap:12px;align-items:center}
.tb-signin{font-size:14px;font-weight:600;color:var(--muted);padding:10px 8px}
.tb-signin:hover{color:var(--txt)}

/* ---- hero ---- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:120px 40px 80px;overflow:visible;background:transparent}
#bg3d{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.hero>*{position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-2);border-radius:999px;
  padding:8px 18px;font-size:13px;color:var(--muted);margin-bottom:30px;background:rgba(255,255,255,.02);
  backdrop-filter:blur(6px)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
h1.hero-h{font-size:clamp(44px,7vw,88px);font-weight:900;line-height:.98;letter-spacing:-.04em;max-width:15ch;margin:0 auto 26px}
.hero-sub{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:40ch;margin:0 auto 36px;line-height:1.5}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:20px;font-size:13px;color:var(--muted-2)}
.scroll-cue{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted-2);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.scroll-cue .mouse{width:22px;height:34px;border:1.5px solid var(--muted-2);border-radius:12px;position:relative}
.scroll-cue .mouse::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:3px;height:7px;border-radius:2px;background:var(--muted);animation:scrolldot 1.6s ease infinite}
@keyframes scrolldot{0%{opacity:0;top:6px}30%{opacity:1}60%{opacity:1;top:16px}100%{opacity:0;top:18px}}

/* ---- section scaffolding ---- */
.block{padding:130px 0;position:relative;z-index:2;background:transparent}
.block.alt{background:transparent}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.h2{font-size:clamp(32px,4.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.06}
.lead{color:var(--muted);font-size:18px;max-width:54ch;margin-top:20px;line-height:1.55}
.sec-head{margin-bottom:60px}
.sec-head.center{text-align:center}
.sec-head.center .lead{margin-left:auto;margin-right:auto}

/* reveal animation */
.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

/* ---- what we do (feature cards) ---- */
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.fcard{border:1px solid var(--line);border-radius:20px;padding:34px;
  background:linear-gradient(180deg,var(--char-2),var(--char));position:relative;overflow:hidden;
  transition:transform .3s,border-color .3s,box-shadow .3s}
.fcard::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity .3s}
.fcard:hover{transform:translateY(-6px);border-color:var(--line-2);box-shadow:0 30px 70px rgba(0,0,0,.4)}
.fcard:hover::after{opacity:1}
.fcard>*{position:relative;z-index:2}
.fnum{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.1em;color:var(--muted-2);margin-bottom:18px}
.fic{width:52px;height:52px;border-radius:14px;background:var(--grad-soft);border:1px solid var(--line-2);display:grid;place-items:center;margin-bottom:22px}
.fic svg{width:24px;height:24px;stroke:var(--accent)}
.fcard h3{font-size:21px;font-weight:700;margin-bottom:11px;letter-spacing:-.02em}
.fcard p{font-size:15px;color:var(--muted);line-height:1.6}
.fprice{margin-top:20px;display:inline-block;font-size:13px;color:var(--silver);font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.02)}

/* ---- what it is ---- */
.what-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center}
.what-list{margin-top:32px;display:flex;flex-direction:column;gap:18px}
.what-item{display:flex;gap:15px;align-items:flex-start}
.what-item .ck{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--grad-soft);border:1px solid var(--line-2);display:grid;place-items:center}
.what-item .ck svg{width:14px;height:14px;stroke:var(--accent)}
.what-item p{font-size:15px;color:var(--muted);line-height:1.55}.what-item p b{color:var(--txt);font-weight:600}
.ui-mock{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--char-2);box-shadow:0 40px 90px rgba(0,0,0,.5)}
.um-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.um-head .t{font-weight:700;font-size:14px}
.um-head .b{font-size:11px;color:var(--accent);border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;background:var(--grad-soft);display:flex;align-items:center;gap:6px}
.um-head .b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.um-chat{padding:24px;display:flex;flex-direction:column;gap:15px}
.bubble{max-width:80%;padding:13px 17px;border-radius:16px;font-size:14px;line-height:1.45}
.bubble.bot{background:var(--char);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.user{align-self:flex-end;background:var(--grad);color:#0a0f16;font-weight:500;border-bottom-right-radius:5px}
.um-typing{display:flex;gap:5px;padding:6px 2px}
.um-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.4s infinite both}
.um-typing span:nth-child(2){animation-delay:.2s}.um-typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---- capabilities tabs ---- */
.tabs-head{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;border:1px solid var(--line);border-radius:999px;padding:6px;width:fit-content;margin-left:auto;margin-right:auto;background:var(--char-2)}
.tab-btn{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;font-size:15px;padding:12px 26px;border-radius:999px;cursor:pointer;transition:.25s}
.tab-btn.active{background:var(--grad);color:#0a0f16;box-shadow:0 8px 22px rgba(91,107,128,.3)}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tab-grid{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center;border:1px solid var(--line);border-radius:24px;padding:52px;background:linear-gradient(135deg,var(--char-2),var(--char))}
.tab-grid .tp h3{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.tab-grid .price{display:inline-block;font-size:14px;color:var(--silver);font-weight:600;margin-bottom:20px;border:1px solid var(--line-2);border-radius:999px;padding:6px 15px;background:var(--grad-soft)}
.tab-grid .tp p{color:var(--muted);font-size:16px;margin-bottom:24px;line-height:1.55}
.tab-feats{display:flex;flex-direction:column;gap:13px}
.tab-feats li{list-style:none;display:flex;gap:12px;align-items:center;font-size:15px}
.tab-feats li svg{width:18px;height:18px;stroke:var(--accent);flex-shrink:0}
.tab-vis{border:1px solid var(--line);border-radius:18px;background:var(--char);padding:26px;min-height:290px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.vis-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--char-2);transition:transform .2s}
.vis-row:hover{transform:translateX(4px)}
.vis-row .vi{width:36px;height:36px;border-radius:10px;background:var(--grad-soft);border:1px solid var(--line-2);display:grid;place-items:center;flex-shrink:0}
.vis-row .vi svg{width:17px;height:17px;stroke:var(--accent)}
.vis-row .vt{font-size:13px;font-weight:600}
.vis-row .vs{font-size:11px;color:var(--muted-2);margin-top:2px}
.vis-row .vb{margin-left:auto;font-size:11px;color:var(--accent);font-weight:600}

/* ---- why us ---- */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.why-card{border:1px solid var(--line);border-radius:20px;padding:34px;background:linear-gradient(180deg,var(--char-2),var(--char));transition:transform .3s,border-color .3s}
.why-card:hover{transform:translateY(-5px);border-color:var(--line-2)}
.why-big{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-bottom:16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.why-card h3{font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
.why-card p{font-size:14px;color:var(--muted);line-height:1.6}

/* ---- industries ---- */
.serv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.serv-col{border:1px solid var(--line);border-radius:20px;padding:36px;background:var(--char-2)}
.serv-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin-bottom:24px;font-weight:700}
.serv-col ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.serv-col li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.serv-col li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grad);flex-shrink:0}

/* ---- resources ---- */
.res-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.rcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--char-2);cursor:pointer;transition:transform .3s,border-color .3s}
.rcard:hover{transform:translateY(-6px);border-color:var(--line-2)}
.rcard .rtop{height:130px;background:linear-gradient(135deg,var(--navy),var(--char));position:relative;overflow:hidden}
.rcard .rtop::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:.5}
.rcard .rtop .ri{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;opacity:.9}
.rcard .rtop .ri svg{width:38px;height:38px;stroke:var(--accent)}
.rcard .rbody{padding:22px}
.rcard .rlabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:11px}
.rcard h4{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.rcard .rmeta{margin-top:15px;font-size:12px;color:var(--muted-2)}

/* ---- final cta ---- */
.final{text-align:center;padding:140px 40px;position:relative;z-index:2;overflow:hidden;background:transparent}
.final h2{font-size:clamp(36px,5.4vw,64px);font-weight:900;letter-spacing:-.04em;line-height:1.02;max-width:20ch;margin:0 auto 24px}
.final p{color:var(--muted);font-size:18px;margin-bottom:38px}
.final-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ---- footer ---- */
footer{border-top:1px solid var(--line);padding:60px 0 40px;background:linear-gradient(180deg,rgba(8,9,12,0),rgba(8,9,12,.92) 40%);position:relative;z-index:2;backdrop-filter:blur(4px)}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px;margin-bottom:48px}
.foot-brand .fb-top{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.foot-brand img{width:30px;height:34px;object-fit:contain}
[data-theme="light"] .foot-brand img{filter:invert(.86)}
.foot-brand .fb-name{font-weight:800;font-size:17px}
.foot-brand p{font-size:14px;color:var(--muted);max-width:32ch;line-height:1.6}
.foot-col h5{font-size:13px;font-weight:700;margin-bottom:16px}
.foot-col a{display:block;font-size:14px;color:var(--muted);margin-bottom:11px;cursor:pointer;transition:color .15s}
.foot-col a:hover{color:var(--accent)}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--line);flex-wrap:wrap;gap:14px}
.foot-bottom p{font-size:13px;color:var(--muted-2)}
.foot-social{display:flex;gap:12px}
.foot-social a{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;transition:.2s}
.foot-social a:hover{border-color:var(--accent);color:var(--accent)}
.foot-social svg{width:16px;height:16px}

/* ---- responsive ---- */
@media(max-width:1080px){
  .what-grid{grid-template-columns:1fr;gap:44px}
  .tab-grid{grid-template-columns:1fr;gap:38px;padding:36px}
  .why-grid{grid-template-columns:1fr}
  .res-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  :root{--sb:0px}
  .sidebar{transform:translateX(-100%);width:264px}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sb-burger{display:flex}
  .sb-scrim.show{display:block}
  .topbar{left:0}
  .topbar .tb-in{right:16px;top:16px}
  .tb-signin{display:none}
  .wrap{padding:0 22px}
  .features,.serv-grid{grid-template-columns:1fr}
  .serv-col ul{grid-template-columns:1fr 1fr}
  .res-row{grid-template-columns:1fr}
  .block{padding:84px 0}
  .hero{padding:100px 22px 80px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}

/* glass legibility over live brain */
.fcard,.why-card,.serv-col,.ui-mock,.tab-grid,.tab-vis,.rcard,.tabs-head{
  background-color:rgba(13,17,23,.62)!important;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
[data-theme="light"] .fcard,[data-theme="light"] .why-card,[data-theme="light"] .serv-col,
[data-theme="light"] .ui-mock,[data-theme="light"] .tab-grid,[data-theme="light"] .tab-vis,
[data-theme="light"] .rcard,[data-theme="light"] .tabs-head{
