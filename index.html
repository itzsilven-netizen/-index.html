<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex Standard</title>
<style>
  :root{
    --ink:#f5f7fa;
    --muted:#aab3c0;
    --accent:#5b8cff;
    --panel-bg:rgba(10,14,22,.55);
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#05070c;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  /* The only element that creates page height — drives the scroll */
  #scroll-space{position:relative;width:1px;}

  /* Fixed full-screen WebGL video background */
  #bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;}

  /* Page panels (fixed, faded in/out by JS) */
  #panels{position:fixed;inset:0;z-index:2;pointer-events:none;}
  .panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;will-change:opacity,transform;}
  .panel .card{
    pointer-events:auto;max-width:820px;width:90%;padding:48px 52px;border-radius:22px;
    background:var(--panel-bg);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.45);}
  .eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 14px;}
  .panel h1{font-size:clamp(34px,6vw,66px);line-height:1.02;margin:0 0 18px;font-weight:800;letter-spacing:-.02em;}
  .panel h2{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:0 0 18px;font-weight:800;letter-spacing:-.02em;}
  .panel p{font-size:clamp(16px,2.1vw,20px);line-height:1.55;color:var(--muted);margin:0 0 14px;}
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .pill{font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--ink);}
  .cta{display:inline-block;margin-top:26px;padding:13px 26px;border-radius:12px;
    background:var(--accent);color:#fff;font-weight:600;text-decoration:none;
    box-shadow:0 12px 30px rgba(91,140,255,.35);}

  /* Sidebar nav */
  #sidebar{position:fixed;top:0;left:0;height:100vh;width:230px;z-index:5;
    display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 22px;
    background:linear-gradient(90deg,rgba(5,7,12,.72),rgba(5,7,12,0));}
  #brand{position:fixed;top:26px;left:24px;z-index:6;font-weight:800;letter-spacing:.02em;font-size:18px;}
  #brand span{color:var(--accent);}
  #sidebar button{all:unset;cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;
    padding:10px 14px;border-radius:10px;transition:color .2s,background .2s,padding-left .2s;}
  #sidebar button:hover{color:var(--ink);background:rgba(255,255,255,.05);}
  #sidebar button.active{color:var(--ink);background:rgba(91,140,255,.16);padding-left:20px;}
  #sidebar button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:transparent;margin-right:10px;vertical-align:middle;transition:background .2s;}
  #sidebar button.active .dot{background:var(--accent);}

  /* Top progress bar */
  #progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:7;
    background:linear-gradient(90deg,var(--accent),#9db8ff);}

  /* Scroll hint */
  #hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:6;
    color:var(--muted);font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    transition:opacity .4s;}

  @media (max-width:720px){
    #sidebar{width:auto;background:none;padding:0 12px;gap:2px;}
    #sidebar button{font-size:13px;padding:7px 10px;}
    .panel .card{padding:30px 24px;}
  }
</style>
</head>
<body>
  <div id="progress"></div>
  <div id="brand">Apex<span>·</span>Standard</div>

  <nav id="sidebar"></nav>

  <canvas id="bg"></canvas>

  <div id="panels"></div>

  <div id="hint">Scroll to explore ↓</div>

  <div id="scroll-space"></div>

  <!-- ============ DATA: edit copy here ============ -->

  <!-- ============ Three.js ============ -->
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ---- Config -------------------------------------------------------------
  const VIDEOS = ['videos/v1.mp4','videos/v2.mp4','videos/v3.mp4','videos/v4.mp4','videos/v5.mp4'];
  const PAGE_VH  = 100;   // scroll height of each page "hold" (in vh)
  const VIDEO_VH = 140;   // scroll height of each video scrub (in vh)
  const pages = JSON.parse(document.getElementById('page-data').textContent);

  // ---- Build the scroll timeline: page, video, page, video, ... -----------
  // Each block has {type, start, h, ...}. Positions are filled after layout.
  const blocks = [];
  pages.forEach((p, i) => {
    blocks.push({ type:'page', page:i });
    if (i < pages.length - 1) blocks.push({ type:'video', vid:i });
  });

  // ---- Build sidebar + panels DOM -----------------------------------------
  const sidebar = document.getElementById('sidebar');
  const panelsEl = document.getElementById('panels');
  const panelNodes = [];
  pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="dot"></span>${p.nav}`;
    btn.addEventListener('click', () => goToPage(i));
    sidebar.appendChild(btn);

    const sec = document.createElement('section');
    sec.className = 'panel';
    sec.innerHTML = `
      <div class="card">
        <p class="eyebrow">${p.eyebrow}</p>
        ${i===0 ? `<h1>${p.title}</h1>` : `<h2>${p.title}</h2>`}
        <p>${p.body}</p>
        <div class="pills">${p.pills.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
        <a class="cta" data-cta="${i}" href="${p.href || '#'}">${p.cta}</a>
      </div>`;
    panelsEl.appendChild(sec);
    panelNodes.push(sec);
  });
  const navButtons = [...sidebar.querySelectorAll('button')];

  // Map page id -> index, for resolving internal "#section" CTA links
  const idToIndex = {};
  pages.forEach((p, i) => idToIndex[p.id] = i);

  // CTA clicks: "#section" -> animated internal jump; mailto/http -> normal link
  panelsEl.addEventListener('click', (e) => {
    const a = e.target.closest('a.cta');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (href.startsWith('#')) {
      const target = idToIndex[href.slice(1)];
      if (target !== undefined) { e.preventDefault(); goToPage(target); }
    } else if (/^https?:/i.test(href)) {
      a.target = '_blank'; a.rel = 'noopener'; // external -> new tab, keep the experience open
    }
    // mailto: falls through to default behavior
  });

  // Brand logo -> scroll home
  document.getElementById('brand').style.cursor = 'pointer';
  document.getElementById('brand').addEventListener('click', () => goToPage(0));

  // ---- Layout: compute pixel positions & total document height ------------
  let totalPx = 0;
  function layout(){
    const vh = window.innerHeight;
    let y = 0;
    for (const b of blocks){
      b.h = (b.type === 'page' ? PAGE_VH : VIDEO_VH) / 100 * vh;
      b.start = y;
      y += b.h;
    }
    totalPx = y;
    document.getElementById('scroll-space').style.height = totalPx + 'px';
  }

  // Scroll position that parks a given page hold centered in the viewport
  function pageScrollTarget(pageIndex){
    const b = blocks.find(b => b.type==='page' && b.page===pageIndex);
    // park so the page hold is centered in view
    return b.start + (b.h - window.innerHeight)/2;
  }

  // ---- Three.js scene: fullscreen video plane with object-fit:cover -------
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  // Load videos as paused, seekable textures
  const videoEls = [];
  const textures = [];
  VIDEOS.forEach(src => {
    const v = document.createElement('video');
    v.src = src; v.muted = true; v.loop = false; v.playsInline = true;
    v.preload = 'auto'; v.crossOrigin = 'anonymous';
    v.setAttribute('webkit-playsinline','');
    // nudge the browser to decode the first frame
    v.addEventListener('loadeddata', () => { try{ v.currentTime = 0.001; }catch(e){} });
    const t = new THREE.VideoTexture(v);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    videoEls.push(v); textures.push(t);
  });

  const uniforms = {
    uTex:      { value: textures[0] },
    uCanvas:   { value: new THREE.Vector2(1,1) },
    uMedia:    { value: new THREE.Vector2(16,9) },
    uDim:      { value: 0.0 },     // 0 = bright video, 1 = dimmed for reading
    uTilt:     { value: 0.0 }      // subtle parallax during scrub
  };

  const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform vec2 uCanvas;
      uniform vec2 uMedia;
      uniform float uDim;
      uniform float uTilt;
      void main(){
        // object-fit: cover
        float rs = uCanvas.x / uCanvas.y;
        float ri = uMedia.x / uMedia.y;
        vec2 nz = (rs < ri) ? vec2(uMedia.x*uCanvas.y/uMedia.y, uCanvas.y)
                            : vec2(uCanvas.x, uMedia.y*uCanvas.x/uMedia.x);
        vec2 off = ((rs < ri) ? vec2((nz.x-uCanvas.x)*0.5, 0.0)
                              : vec2(0.0,(nz.y-uCanvas.y)*0.5)) / nz;
        vec2 uv = vUv * uCanvas/nz + off;
        // subtle parallax push during scrub
        uv += vec2(0.0, uTilt*0.02);
        vec3 col = texture2D(uTex, uv).rgb;
        // dim + slight blue grade toward background for legibility
        col = mix(col, vec3(0.02,0.03,0.06), uDim);
        // vignette
        float d = distance(vUv, vec2(0.5));
        col *= smoothstep(0.95, 0.35, d) * 0.45 + 0.55;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

  // ---- Active-video switching --------------------------------------------
  let activeVid = 0;
  function setActiveVideo(i, time){
    if (i !== activeVid){ activeVid = i; uniforms.uTex.value = textures[i]; }
    const v = videoEls[i];
    const dur = (v.duration && isFinite(v.duration)) ? v.duration : 0;
    if (dur > 0){
      const target = Math.max(0, Math.min(dur - 0.01, time));
      // only seek if meaningfully different (avoids thrashing the decoder)
      if (Math.abs(v.currentTime - target) > 0.02) { try{ v.currentTime = target; }catch(e){} }
      uniforms.uMedia.value.set(v.videoWidth||16, v.videoHeight||9);
    }
  }

  // ---- Scroll → state -----------------------------------------------------
  let targetScroll = window.scrollY;
  function smooth(a,b,t){ return a + (b-a)*t; }

  function updateFromScroll(){
    const y = window.scrollY;

    // find the block we're in
    let block = blocks[0];
    for (const b of blocks){ if (y >= b.start) block = b; }

    let dim = 0.85, tilt = 0;
    // reset panels
    panelNodes.forEach(n => { n.style.opacity = 0; });

    if (block.type === 'video'){
      const p = Math.min(1, Math.max(0, (y - block.start) / block.h));
      const v = videoEls[block.vid];
      const dur = (v.duration && isFinite(v.duration)) ? v.duration : 1;
      setActiveVideo(block.vid, p * dur);
      tilt = (p - 0.5) * 2;
      dim = 0.0; // show video fully during scrub

      // cross-fade the outgoing / incoming page panels at the edges
      const outPage = block.vid;       // page before this video
      const inPage  = block.vid + 1;   // page after this video
      if (p < 0.18) setPanel(outPage, 1 - p/0.18, -40*(p/0.18));
      if (p > 0.82) setPanel(inPage, (p-0.82)/0.18, 40*(1-(p-0.82)/0.18));
    } else {
      // page hold: freeze the appropriate video frame
      const pageIdx = block.page;
      if (pageIdx === 0){
        setActiveVideo(0, 0);                 // first frame of v1
      } else {
        const v = videoEls[pageIdx-1];
        const dur = (v.duration && isFinite(v.duration)) ? v.duration : 0;
        setActiveVideo(pageIdx-1, dur);       // last frame of previous video
      }
      // fade panel in/out within the hold
      const p = (y - block.start) / block.h;  // 0..1 across the hold
      const vis = Math.min(1, Math.min(p, 1-p) / 0.18);
      setPanel(pageIdx, Math.max(0, vis), (0.5 - p) * 30);
      dim = 0.78;
    }

    uniforms.uDim.value  = smooth(uniforms.uDim.value, dim, 0.15);
    uniforms.uTilt.value = smooth(uniforms.uTilt.value, tilt, 0.15);

    // progress bar + active nav
    document.getElementById('progress').style.width = (y/(totalPx-window.innerHeight)*100)+'%';
    let nearest = 0, best = Infinity;
    pages.forEach((_, i) => {
      const c = pageScrollTarget(i);
      const d = Math.abs(c - y);
      if (d < best){ best = d; nearest = i; }
    });
    navButtons.forEach((b,i)=> b.classList.toggle('active', i===nearest));
    document.getElementById('hint').style.opacity = y > 40 ? 0 : 1;
  }

  function setPanel(i, opacity, dy){
    const n = panelNodes[i]; if (!n) return;
    n.style.opacity = Math.max(0, Math.min(1, opacity));
    n.style.transform = `translateY(${dy}px)`;
  }

  // ---- Sidebar click → animated scroll (scrubs videos on the way) ---------
  let tweening = false;
  function goToPage(i){
    const start = window.scrollY;
    const end = pageScrollTarget(i);
    const dist = Math.abs(end - start);
    const dur = Math.min(2600, Math.max(700, dist / 2.2));
    const t0 = performance.now();
    tweening = true;
    function step(now){
      const p = Math.min(1, (now - t0) / dur);
      const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; // easeInOutQuad
      window.scrollTo(0, start + (end - start)*e);
      if (p < 1) requestAnimationFrame(step); else tweening = false;
    }
    requestAnimationFrame(step);
  }

  // ---- Resize / render loop ----------------------------------------------
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    uniforms.uCanvas.value.set(w, h);
    layout();
    updateFromScroll();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('scroll', updateFromScroll, { passive:true });

  function animate(){
    requestAnimationFrame(animate);
    // VideoTextures are paused, so refresh the active one manually
    textures[activeVid].needsUpdate = true;
    renderer.render(scene, camera);
  }

  layout();
  resize();
  updateFromScroll();
  animate();
  </script>
</body>
</html>
