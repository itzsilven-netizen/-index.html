<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Standard – Hero Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050a12;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
  }

  /* HUD overlay */
  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #state-label {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.4s, transform 0.4s;
  }

  .dot.active {
    background: #f97316;
    transform: scale(1.5);
    box-shadow: 0 0 12px #f97316;
  }

  #service-name {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    transition: opacity 0.5s;
    white-space: nowrap;
  }

  #top-label {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }

  /* Progress bar */
  #progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #f97316, #3b82f6);
    width: 0%;
    transition: width linear;
  }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="c"></canvas>
  <div id="hud">
    <span id="top-label">Apex Standard · AI Automation</span>
    <span id="service-name">Neural Core</span>
    <div id="state-label">
      <div class="dot active" id="dot-0"></div>
      <div class="dot" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
    </div>
  </div>
  <div id="progress-bar"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x050a12, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 22);

// ─── Mouse tracking ─────────────────────────────────────────────────────────
const mouse = { x: 0, y: 0 };
window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2;
});

// ─── State definitions ──────────────────────────────────────────────────────
const STATES = [
  {
    name: 'Neural Core',
    label: 'AI Brain · The Intelligence Engine',
    color: new THREE.Color(0x3b82f6),
    accent: new THREE.Color(0x93c5fd),
    nodeCount: 280,
    connectionDist: 3.8,
    spread: 7,
    pulsate: true,
  },
  {
    name: 'Lead Capture',
    label: 'AI Chatbot · 24/7 Lead Capture',
    color: new THREE.Color(0xf97316),
    accent: new THREE.Color(0xfb923c),
    nodeCount: 160,
    connectionDist: 3.5,
    spread: 5,
    pulsate: false,
  },
  {
    name: 'Reputation System',
    label: 'AI Reviews · Auto Reputation Management',
    color: new THREE.Color(0x10b981),
    accent: new THREE.Color(0x34d399),
    nodeCount: 180,
    connectionDist: 3.8,
    spread: 6,
    pulsate: false,
  },
  {
    name: 'Social Engine',
    label: 'AI Social · Content on Autopilot',
    color: new THREE.Color(0xa855f7),
    accent: new THREE.Color(0xc084fc),
    nodeCount: 170,
    connectionDist: 3.6,
    spread: 6.5,
    pulsate: false,
  }
];

// ─── Node system ─────────────────────────────────────────────────────────────
const MAX_NODES = 280;
const nodePositions = [];
const nodeTargets = [];
const nodeVelocities = [];
const nodeSpeeds = [];
const nodeRoles = []; // 0=cortex, 1=deep, 2=synapse

// geometry buffers
const nodeGeo = new THREE.BufferGeometry();
const posArr = new Float32Array(MAX_NODES * 3);
const colArr = new Float32Array(MAX_NODES * 3);
const sizeArr = new Float32Array(MAX_NODES);

for (let i = 0; i < MAX_NODES; i++) {
  const v = new THREE.Vector3(
    (Math.random() - 0.5) * 14,
    (Math.random() - 0.5) * 14,
    (Math.random() - 0.5) * 14
  );
  nodePositions.push(v.clone());
  nodeTargets.push(v.clone());
  nodeVelocities.push(new THREE.Vector3());
  nodeSpeeds.push(0.015 + Math.random() * 0.025);
  nodeRoles.push(i < 180 ? 0 : i < 240 ? 1 : 2);

  posArr[i*3]   = v.x;
  posArr[i*3+1] = v.y;
  posArr[i*3+2] = v.z;
  colArr[i*3]   = 0.23;
  colArr[i*3+1] = 0.51;
  colArr[i*3+2] = 1.0;
  // cortex nodes larger, deep smaller, synapses tiny bright
  sizeArr[i] = i < 180 ? (2 + Math.random() * 3) : i < 240 ? (1.5 + Math.random() * 2) : (1 + Math.random() * 1.5);
}

nodeGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
nodeGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
nodeGeo.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));

const nodeMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = distance(gl_PointCoord, vec2(0.5));
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.2, 0.5, d);
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  vertexColors: true,
  depthWrite: false,
});

const nodePoints = new THREE.Points(nodeGeo, nodeMat);
scene.add(nodePoints);

// ─── Connection lines ─────────────────────────────────────────────────────────
const MAX_LINES = 900;
const lineGeo = new THREE.BufferGeometry();
const linePosArr = new Float32Array(MAX_LINES * 2 * 3);
const lineColArr = new Float32Array(MAX_LINES * 2 * 3);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePosArr, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColArr, 3));

const lineMat = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.4,
  depthWrite: false,
}));
scene.add(lineMat);

// ─── Synapse pulse particles ──────────────────────────────────────────────────
const MAX_PULSES = 60;
const pulses = [];
for (let i = 0; i < MAX_PULSES; i++) {
  pulses.push({ from: 0, to: 1, t: Math.random(), speed: 0.008 + Math.random() * 0.014, active: false });
}
const pulseGeo = new THREE.BufferGeometry();
const pulsePosArr = new Float32Array(MAX_PULSES * 3);
const pulseColArr = new Float32Array(MAX_PULSES * 3);
const pulseSizeArr = new Float32Array(MAX_PULSES);
pulseGeo.setAttribute('position', new THREE.BufferAttribute(pulsePosArr, 3));
pulseGeo.setAttribute('color', new THREE.BufferAttribute(pulseColArr, 3));
pulseGeo.setAttribute('size', new THREE.BufferAttribute(pulseSizeArr, 1));

const pulseMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = distance(gl_PointCoord, vec2(0.5));
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.0, 0.5, d);
      gl_FragColor = vec4(vColor, alpha * 0.9);
    }
  `,
  transparent: true,
  vertexColors: true,
  depthWrite: false,
});
const pulsePoints = new THREE.Points(pulseGeo, pulseMat);
scene.add(pulsePoints);

let activeEdges = [];

// ─── Central core sphere ─────────────────────────────────────────────────────
const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// inner glow sphere
const glowGeo = new THREE.SphereGeometry(0.9, 16, 16);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.15 });
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
scene.add(glowMesh);

// ring
const ringGeo = new THREE.TorusGeometry(2.2, 0.03, 8, 80);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 2;
scene.add(ringMesh);

const ring2Geo = new THREE.TorusGeometry(2.8, 0.015, 8, 80);
const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.2 });
const ring2Mesh = new THREE.Mesh(ring2Geo, ring2Mat);
ring2Mesh.rotation.x = Math.PI / 3;
ring2Mesh.rotation.y = Math.PI / 5;
scene.add(ring2Mesh);

// ─── State shapes ─────────────────────────────────────────────────────────────
function buildBrainPositions(n, spread) {
  const pts = [];

  // ── Helper: place a node on a hemisphere surface with sulcal folds
  function brainSurface(side, u, v, layer) {
    // side: -1 = left, +1 = right
    // u,v in [0,1] parametric on hemisphere
    const theta = u * Math.PI;          // polar
    const phi   = v * Math.PI;          // azimuth half
    const sx = side * (Math.sin(theta) * Math.cos(phi));
    const sy = Math.cos(theta);
    const sz = Math.sin(theta) * Math.sin(phi);

    // sulci grooves — fold the surface inward at regular bands
    const foldU = Math.sin(u * Math.PI * 5) * 0.18;  // gyri ridges
    const foldV = Math.sin(v * Math.PI * 4) * 0.12;
    const foldW = Math.sin((u + v) * Math.PI * 3) * 0.08;
    const fold  = 1.0 - Math.abs(foldU + foldV + foldW) * 0.4;

    // layer offset: cortex surface, white matter mid, deep core
    const r = spread * (0.55 + layer * 0.22) * fold;

    // hemisphere separation gap
    const xOff = side * spread * 0.08;

    return new THREE.Vector3(sx * r + xOff, sy * r, sz * r);
  }

  // ── Left hemisphere cortex (surface layer)
  const cortexL = Math.floor(n * 0.30);
  for (let i = 0; i < cortexL; i++) {
    const u = Math.random();
    const v = Math.random();
    pts.push(brainSurface(-1, u, v, 1.0));
  }

  // ── Right hemisphere cortex
  const cortexR = Math.floor(n * 0.30);
  for (let i = 0; i < cortexR; i++) {
    const u = Math.random();
    const v = Math.random();
    pts.push(brainSurface(1, u, v, 1.0));
  }

  // ── White matter / mid layer both hemispheres
  const white = Math.floor(n * 0.18);
  for (let i = 0; i < white; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    pts.push(brainSurface(side, Math.random(), Math.random(), 0.6));
  }

  // ── Deep core / brainstem clusters
  const deep = Math.floor(n * 0.10);
  for (let i = 0; i < deep; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    pts.push(brainSurface(side, Math.random(), Math.random(), 0.25));
  }

  // ── Corpus callosum — bridge nodes connecting hemispheres (center band)
  const corpus = Math.floor(n * 0.07);
  for (let i = 0; i < corpus; i++) {
    const x = (Math.random() - 0.5) * spread * 0.18;
    const y = (Math.random() - 0.5) * spread * 0.35;
    const z = (Math.random() * 0.6 + 0.1) * spread * 0.55;
    pts.push(new THREE.Vector3(x, y, z));
  }

  // ── Frontal lobe emphasis (forward cluster)
  const frontal = Math.floor(n * 0.05);
  for (let i = 0; i < frontal; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const x = side * (spread * 0.35 + Math.random() * spread * 0.2);
    const y = spread * 0.1 + Math.random() * spread * 0.3;
    const z = -spread * 0.3 + Math.random() * spread * 0.3;
    pts.push(new THREE.Vector3(x, y, z));
  }

  return pts;
}

function buildChatPositions(n, spread) {
  // speech bubble grid — chatbot
  const pts = [];
  for (let i = 0; i < n; i++) {
    const col = Math.floor(i % 10);
    const row = Math.floor(i / 10);
    const x = (col - 4.5) * (spread * 0.22);
    const y = (row - Math.floor(n/10)/2) * (spread * 0.28);
    const z = (Math.random() - 0.5) * 1.5;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

function buildReviewPositions(n, spread) {
  // star pattern — reviews
  const pts = [];
  for (let i = 0; i < n; i++) {
    const star = i % 5;
    const ring = Math.floor(i / 5);
    const angle = (star / 5) * Math.PI * 2 + (ring * 0.3);
    const radius = 1.5 + ring * (spread / (n / 5)) * 0.8;
    const y = (Math.random() - 0.5) * spread * 0.4;
    pts.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      y,
      Math.sin(angle) * radius
    ));
  }
  return pts;
}

function buildSocialPositions(n, spread) {
  // network hub-spoke — social
  const pts = [];
  const hubs = 6;
  for (let i = 0; i < n; i++) {
    const hub = i % hubs;
    const hubAngle = (hub / hubs) * Math.PI * 2;
    const hubX = Math.cos(hubAngle) * spread * 0.55;
    const hubZ = Math.sin(hubAngle) * spread * 0.55;
    const local = (Math.random() - 0.5) * spread * 0.4;
    const local2 = (Math.random() - 0.5) * spread * 0.4;
    pts.push(new THREE.Vector3(
      hubX + local,
      (Math.random() - 0.5) * spread * 0.5,
      hubZ + local2
    ));
  }
  return pts;
}

const shapeFns = [buildBrainPositions, buildChatPositions, buildReviewPositions, buildSocialPositions];

function setTargets(stateIdx) {
  const s = STATES[stateIdx];
  const fn = shapeFns[stateIdx];
  const pts = fn(s.nodeCount, s.spread);
  for (let i = 0; i < MAX_NODES; i++) {
    const pt = pts[i % pts.length];
    const jitter = new THREE.Vector3(
      (Math.random()-0.5)*0.5,
      (Math.random()-0.5)*0.5,
      (Math.random()-0.5)*0.5
    );
    nodeTargets[i].copy(pt).add(jitter);
  }
}

// ─── Color lerp helpers ───────────────────────────────────────────────────────
let currentColor = new THREE.Color(0x3b82f6);
let targetColor  = new THREE.Color(0x3b82f6);
let currentAccent = new THREE.Color(0x60a5fa);
let targetAccent  = new THREE.Color(0x60a5fa);
const lerpColor = new THREE.Color();

// ─── State machine ────────────────────────────────────────────────────────────
const INTERVAL = 4000; // 4 seconds per state
let stateIdx = 0;
let lastSwitch = performance.now();
let transitioning = false;

const serviceNameEl = document.getElementById('service-name');
const progressBar = document.getElementById('progress-bar');
const dots = [0,1,2,3].map(i => document.getElementById('dot-'+i));

function switchState(idx) {
  stateIdx = idx;
  const s = STATES[idx];
  targetColor.copy(s.color);
  targetAccent.copy(s.accent);
  setTargets(idx);
  serviceNameEl.style.opacity = '0';
  setTimeout(() => {
    serviceNameEl.textContent = s.label;
    serviceNameEl.style.opacity = '1';
  }, 400);
  dots.forEach((d,i) => d.classList.toggle('active', i === idx));
}

setTargets(0);
serviceNameEl.textContent = STATES[0].label;

// ─── Main render loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const now = performance.now();

  // auto-advance state
  const elapsed = now - lastSwitch;
  const pct = Math.min(elapsed / INTERVAL, 1);
  progressBar.style.width = (pct * 100) + '%';
  progressBar.style.transition = 'width ' + (INTERVAL/1000) + 's linear';

  if (elapsed > INTERVAL) {
    lastSwitch = now;
    switchState((stateIdx + 1) % STATES.length);
  }

  // lerp colors
  currentColor.lerp(targetColor, 0.03);
  currentAccent.lerp(targetAccent, 0.03);

  // update nodes
  const positions = nodeGeo.attributes.position.array;
  const colors = nodeGeo.attributes.color.array;
  for (let i = 0; i < MAX_NODES; i++) {
    const pos = nodePositions[i];
    const tgt = nodeTargets[i];
    const vel = nodeVelocities[i];
    const spd = nodeSpeeds[i];

    // spring toward target
    vel.x += (tgt.x - pos.x) * 0.06;
    vel.y += (tgt.y - pos.y) * 0.06;
    vel.z += (tgt.z - pos.z) * 0.06;
    vel.multiplyScalar(0.88);

    // subtle oscillation
    pos.x += vel.x + Math.sin(t * spd * 2 + i) * 0.008;
    pos.y += vel.y + Math.cos(t * spd * 1.5 + i) * 0.008;
    pos.z += vel.z + Math.sin(t * spd + i * 0.5) * 0.006;

    positions[i*3]   = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;

    // color shimmer
    const shimmer = 0.85 + 0.15 * Math.sin(t * 2 + i * 0.3);
    lerpColor.lerpColors(currentColor, currentAccent, Math.sin(i * 0.7) * 0.5 + 0.5);
    colors[i*3]   = lerpColor.r * shimmer;
    colors[i*3+1] = lerpColor.g * shimmer;
    colors[i*3+2] = lerpColor.b * shimmer;
  }
  nodeGeo.attributes.position.needsUpdate = true;
  nodeGeo.attributes.color.needsUpdate = true;

  // update connections + collect active edges
  const lp = lineGeo.attributes.position.array;
  const lc = lineGeo.attributes.color.array;
  const dist = STATES[stateIdx].connectionDist;
  let lineIdx = 0;
  activeEdges = [];
  for (let i = 0; i < MAX_NODES && lineIdx < MAX_LINES; i++) {
    for (let j = i+1; j < MAX_NODES && lineIdx < MAX_LINES; j++) {
      const dx = nodePositions[i].x - nodePositions[j].x;
      const dy = nodePositions[i].y - nodePositions[j].y;
      const dz = nodePositions[i].z - nodePositions[j].z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < dist) {
        const alpha = (1 - d / dist) * 0.7;
        lp[lineIdx*6]   = nodePositions[i].x;
        lp[lineIdx*6+1] = nodePositions[i].y;
        lp[lineIdx*6+2] = nodePositions[i].z;
        lp[lineIdx*6+3] = nodePositions[j].x;
        lp[lineIdx*6+4] = nodePositions[j].y;
        lp[lineIdx*6+5] = nodePositions[j].z;
        const c = currentColor;
        // brain state: brighter inner lines
        const brightness = stateIdx === 0 ? alpha * 1.2 : alpha;
        lc[lineIdx*6]   = c.r * brightness;
        lc[lineIdx*6+1] = c.g * brightness;
        lc[lineIdx*6+2] = c.b * brightness;
        lc[lineIdx*6+3] = c.r * alpha * 0.4;
        lc[lineIdx*6+4] = c.g * alpha * 0.4;
        lc[lineIdx*6+5] = c.b * alpha * 0.4;
        activeEdges.push([i, j]);
        lineIdx++;
      }
    }
  }
  for (let k = lineIdx; k < MAX_LINES; k++) {
    lp[k*6] = lp[k*6+1] = lp[k*6+2] = 0;
    lp[k*6+3] = lp[k*6+4] = lp[k*6+5] = 0;
  }
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
  lineGeo.setDrawRange(0, lineIdx * 2);

  // ── Synapse pulses (brain state only, subtle on others)
  const pulseActive = stateIdx === 0;
  if (activeEdges.length > 0) {
    for (let p = 0; p < MAX_PULSES; p++) {
      const pulse = pulses[p];
      if (!pulse.active) {
        if (Math.random() < (pulseActive ? 0.04 : 0.008)) {
          const edge = activeEdges[Math.floor(Math.random() * activeEdges.length)];
          pulse.from = edge[0];
          pulse.to   = edge[1];
          pulse.t    = 0;
          pulse.speed = 0.01 + Math.random() * 0.02;
          pulse.active = true;
        }
      }
      if (pulse.active) {
        pulse.t += pulse.speed;
        if (pulse.t >= 1) { pulse.active = false; }
        const a = nodePositions[pulse.from];
        const b = nodePositions[pulse.to];
        pulsePosArr[p*3]   = a.x + (b.x - a.x) * pulse.t;
        pulsePosArr[p*3+1] = a.y + (b.y - a.y) * pulse.t;
        pulsePosArr[p*3+2] = a.z + (b.z - a.z) * pulse.t;
        const bright = 1.0 - Math.abs(pulse.t - 0.5) * 1.5;
        pulseColArr[p*3]   = currentAccent.r * bright + 0.4;
        pulseColArr[p*3+1] = currentAccent.g * bright + 0.4;
        pulseColArr[p*3+2] = currentAccent.b * bright + 0.5;
        pulseSizeArr[p] = pulseActive ? (3 + bright * 4) : (1.5 + bright * 2);
      } else {
        pulsePosArr[p*3] = pulsePosArr[p*3+1] = pulsePosArr[p*3+2] = 0;
        pulseSizeArr[p] = 0;
      }
    }
    pulseGeo.attributes.position.needsUpdate = true;
    pulseGeo.attributes.color.needsUpdate = true;
    pulseGeo.attributes.size.needsUpdate = true;
  }

  // core rotation + mouse parallax
  const targetRX = mouse.y * 0.3;
  const targetRY = mouse.x * 0.3;
  coreMesh.rotation.y += 0.008;
  coreMesh.rotation.x += 0.003;
  coreMesh.material.color.copy(currentColor);
  glowMesh.material.color.copy(currentColor);

  ringMesh.rotation.z += 0.004;
  ringMesh.material.color.copy(currentColor);
  ring2Mesh.rotation.y += 0.006;
  ring2Mesh.rotation.x += 0.002;
  ring2Mesh.material.color.copy(currentAccent);

  // pulse core
  const pulse = 1 + 0.05 * Math.sin(t * 2.5);
  coreMesh.scale.setScalar(pulse);
  glowMesh.scale.setScalar(pulse * 1.1);

  // camera mouse parallax
  camera.position.x += (mouse.x * 2 - camera.position.x) * 0.04;
  camera.position.y += (mouse.y * 1.5 - camera.position.y) * 0.04;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
